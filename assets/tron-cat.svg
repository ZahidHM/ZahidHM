  .tl{animation:tl 1.2s ease-in-out infinite}@keyframes tl{50%{stroke-opacity:.3}}
  .tag{font:600 12px "Consolas","Courier New",monospace;letter-spacing:6px}
  @media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
