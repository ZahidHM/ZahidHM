th="0.96"/><line class="h" style="animation-delay:0.72s" x1="0" y1="191.1" x2="1000" y2="191.1" stroke-width="1.08"/><line class="h" style="animation-delay:0.90s" x1="0" y1="203.4" x2="1000" y2="203.4" stroke-width="1.20"/><line class="h" style="animation-delay:1.08s" x1="0" y1="218.0" x2="1000" y2="218.0" stroke-width="1.32"/><line class="h" style="animation-delay:1.26s" x1="0" y1="235.0" x2="1000" y2="235.0" stroke-width="1.44"/><line class="h" style="animation-delay:1.44s" x1="0" y1="254.4" x2="1000" y2="254.4" stroke-width="1.56"/><line class="h" style="animation-delay:1.62s" x1="0" y1="276.1" x2="1000" y2="276.1" stroke-width="1.68"/><line class="h" style="animation-delay:1.80s" x1="0" y1="300.0" x2="1000" y2="300.0" stroke-width="1.80"/><path class="trail c" d="M500 168 L60 302" pathLength="100"/><path class="trail o" d="M500 168 L830 302" pathLength="100"/><path class="trail c b" d="M500 168 L1160 302" pathLength="100"/><path class="trail o b" d="M500 168 L-270 302" pathLength="100"/></g>
<line x1="0" y1="168" x2="1000" y2="168" stroke="#00F7F7" stroke-width="2" filter="url(#glow)"/>
