<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="Zahid Hernandez Mejia">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05080d"/><stop offset=".62" stop-color="#0a1620"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00F7F7" stop-opacity=".22"/><stop offset="1" stop-color="#00F7F7" stop-opacity="0"/></linearGradient>
  <radialGradient id="sun" cx=".5" cy="1" r=".6"><stop offset="0" stop-color="#00F7F7" stop-opacity=".55"/><stop offset="1" stop-color="#00F7F7" stop-opacity="0"/></radialGradient>
  <linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#0d1117"/><stop offset=".18" stop-color="#0d1117" stop-opacity="0"/><stop offset=".82" stop-color="#0d1117" stop-opacity="0"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow2" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="floorclip"><rect x="0" y="168" width="1000" height="132"/></clipPath>
</defs>
<style>
  .g{stroke:#00F7F7;stroke-opacity:.34}
  .h{stroke:#00F7F7;stroke-opacity:.08;animation:sweep 2.4s ease-in-out infinite}
  @keyframes sweep{0%,100%{stroke-opacity:.08}18%{stroke-opacity:.85}40%{stroke-opacity:.14}}
  .trail{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 93;stroke-dashoffset:100;animation:ride 3.2s linear infinite}
  .trail.c{stroke:#00F7F7;filter:url(#glow)}.trail.o{stroke:#FF6A00;filter:url(#glow)}.trail.b{animation-delay:-1.6s;animation-duration:4.1s}
  @keyframes ride{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  .hud{fill:none;stroke:#00F7F7;stroke-width:2;stroke-opacity:.9;filter:url(#glow2)}
  .name{font:700 40px "Segoe UI",Arial,Helvetica,sans-serif;letter-spacing:9px;fill:#fff;filter:url(#glow2)}
  .tag{font:600 13px "Consolas","Courier New",monospace;letter-spacing:7px;fill:#00F7F7}
  .tag2{font:600 11px "Consolas","Courier New",monospace;letter-spacing:4px;fill:#FF6A00}
  .scan{animation:scan 5.5s linear infinite}@keyframes scan{from{transform:translateY(-8px)}to{transform:translateY(300px)}}
  .blink{animation:blink 1.2s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.h,.trail,.scan,.blink{animation:none}.h{stroke-opacity:.3}}
</style>
<rect width="1000" height="300" fill="url(#sky)"/>
<ellipse cx="500" cy="168" rx="420" ry="90" fill="url(#sun)"/>
